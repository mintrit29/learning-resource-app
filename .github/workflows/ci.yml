name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: learning-resource-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: learning-resource-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:desktop-runtime
