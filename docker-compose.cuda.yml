services:
  embedding:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124
        TORCH_VERSION: 2.6.0
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  web:
    environment:
      EMBEDDING_DEVICE: cuda
      EMBEDDING_BATCH_SIZE: "2"
