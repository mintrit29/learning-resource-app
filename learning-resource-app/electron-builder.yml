appId: vn.scholarflow.desktop
productName: ScholarFlow
asar: true
beforeBuild: ./scripts/skip-desktop-dependencies.cjs

directories:
  app: electron
  output: dist-electron

files:
  - main.cjs
  - preload.cjs
  - component-manager.cjs
  - visual-search.cjs
  - microphone-permission.cjs
  - package.json

extraResources:
  - from: .next/standalone
    to: app
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - "**/*"
  - from: embedding-runtime
    to: embedding-runtime
    filter:
      - "service.mjs"
      - "package.json"
      - "package-lock.json"
  - from: embedding-runtime/node_modules
    to: embedding-runtime/node_modules
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ScholarFlow-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
