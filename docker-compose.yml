services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scholarflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learning_resources
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - scholarflow_postgres_data:/var/lib/postgresql/data
      - ./learning-resource-app/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_resources"]
      interval: 5s
      timeout: 5s
      retries: 20

  embedding:
    build:
      context: ./embedding-service
    container_name: scholarflow-embedding
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
      EMBEDDING_BATCH_SIZE: "4"
      HF_HOME: /app/models-cache
    ports:
      - "8001:8001"
    volumes:
      - scholarflow_model_cache:/app/models-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ./learning-resource-app
    container_name: scholarflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/learning_resources?schema=public
      AUTH_SECRET: scholarflow-local-dev-secret-change-me
      AUTH_TRUST_HOST: "true"
      EMBEDDING_SERVICE_URL: http://embedding:8001
    ports:
      - "3000:3000"
    volumes:
      - scholarflow_uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy

volumes:
  scholarflow_postgres_data:
  scholarflow_model_cache:
  scholarflow_uploads:
